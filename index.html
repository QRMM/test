<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 新年计划与成长手记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #fdf2f8 50%, #f0fdf4 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 820px;
            padding: 50px 45px;
            border-radius: 24px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.07);
            min-height: 600px;
            display: flex;
            flex-direction: column;
        }

        /* 头部居中区域 */
        .header-center {
            text-align: center;
            margin-bottom: 35px;
        }

        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            margin-bottom: 14px;
            letter-spacing: 1px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
        }

        /* 新增表单区域 */
        .add-form {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .add-form input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            background-color: #fafafa;
        }

        .add-form input:focus {
            border-color: #6366f1;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .add-form button {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
            white-space: nowrap;
        }

        .add-form button:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.35);
        }

        /* 计划列表 */
        .plan-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 35px;
            flex: 1;
        }

        .plan-item {
            display: flex;
            align-items: center;
            padding: 18px 24px;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: all 0.25s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        /* 多彩马卡龙色循环 */
        .plan-item:nth-child(6n+1) {
            background-color: #f5f3ff;
            border-color: #ddd6fe;
        }

        .plan-item:nth-child(6n+2) {
            background-color: #f0fdf4;
            border-color: #bbf7d0;
        }

        .plan-item:nth-child(6n+3) {
            background-color: #fffbeb;
            border-color: #fde68a;
        }

        .plan-item:nth-child(6n+4) {
            background-color: #f0f9ff;
            border-color: #bae6fd;
        }

        .plan-item:nth-child(6n+5) {
            background-color: #fdf2f8;
            border-color: #fbcfe8;
        }

        .plan-item:nth-child(6n+6) {
            background-color: #ecfdf5;
            border-color: #a7f3d0;
        }

        .plan-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
        }

        .plan-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #6366f1;
            cursor: pointer;
            margin-right: 18px;
            flex-shrink: 0;
        }

        .plan-content {
            flex: 1;
            cursor: pointer;
        }

        .plan-title {
            font-size: 15px;
            font-weight: 600;
            color: #1e293b;
            outline: none;
            border-bottom: 1px dashed transparent;
            padding: 2px 6px;
            border-radius: 4px;
            word-break: break-all;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .plan-title:hover {
            background-color: rgba(255, 255, 255, 0.6);
            border-color: #cbd5e1;
        }

        .plan-title:focus {
            background-color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .detail-link-tip {
            font-size: 12px;
            color: #6366f1;
            margin-top: 2px;
            margin-left: 6px;
            opacity: 0.8;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            transition: all 0.2s;
            margin-left: 12px;
        }

        .delete-btn:hover {
            color: #ef4444;
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* 详情页样式 */
        #detailView {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 16px;
        }

        .back-btn {
            background-color: #e2e8f0;
            color: #334155;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .back-btn:hover {
            background-color: #cbd5e1;
        }

        .detail-title-box h2 {
            font-size: 22px;
            color: #1e293b;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .detail-textarea {
            width: 100%;
            height: 180px;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            resize: vertical;
            transition: border-color 0.2s;
        }

        .detail-textarea:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .image-upload-box {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .file-input-label {
            background-color: #f1f5f9;
            color: #475569;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 1px dashed #cbd5e1;
            transition: all 0.2s;
        }

        .file-input-label:hover {
            background-color: #e2e8f0;
            border-color: #94a3b8;
        }

        #imageInput {
            display: none;
        }

        .image-preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 10px;
        }

        .image-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            height: 100px;
            background: #f8fafc;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-img-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-img-btn:hover {
            background: #ef4444;
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #64748b;
            border-top: 1px solid #f1f5f9;
            padding-top: 20px;
            font-weight: 500;
            margin-top: auto;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- ================= 视图一：首页列表 ================= -->
        <div id="homeView">
            <div class="header-center">
                <div class="badge">2027 GOALS</div>
                <h1>✨ 2027 新年计划</h1>
                <div class="subtitle">健康生活，从点滴日常做起（点击目标文字查看与记录详情）</div>
            </div>

            <div class="add-form">
                <input type="text" id="planInput" placeholder="输入新的计划目标..." onkeypress="handleKeyPress(event)">
                <button onclick="addPlan()">添加目标</button>
            </div>

            <div class="plan-list" id="planList">
                <!-- 动态生成 -->
            </div>
        </div>

        <!-- ================= 视图二：目标详情与记录页 ================= -->
        <div id="detailView">
            <div class="detail-header">
                <button class="back-btn" onclick="goBackToHome()">← 返回列表</button>
                <div class="detail-title-box">
                    <h2 id="currentDetailTitle">目标详情</h2>
                </div>
                <div style="width: 70px;"></div>
            </div>

            <div class="detail-section">
                <label>📝 设想与达成情况记录</label>
                <textarea id="detailNotes" class="detail-textarea" placeholder="在此记录你的设想、实施步骤、复盘总结或心情感悟..."
                    oninput="autoSaveDetail()"></textarea>
            </div>

            <div class="detail-section">
                <label>🖼️ 相关图片凭证 / 瞬间记录</label>
                <div class="image-upload-box">
                    <label class="file-input-label" for="imageInput">➕ 选择上传图片</label>
                    <input type="file" id="imageInput" accept="image/*" multiple onchange="handleImageUpload(event)">
                    <span style="font-size: 12px; color: #94a3b8;">支持多张图片上传，自动保存在本地</span>
                </div>
                <div class="image-preview-container" id="imagePreviewContainer">
                    <!-- 动态图片卡片 -->
                </div>
            </div>
        </div>

        <div class="footer">
            Keep going, you've got this! 🚀
        </div>
    </div>

    <script>
        // 默认初始数据
        const defaultPlans = [
            { id: 1, text: "每天规律睡眠 7 小时", completed: false, notes: "", images: [] },
            { id: 2, text: "周末出门晒一次太阳", completed: false, notes: "", images: [] },
            { id: 3, text: "每周进行 3 次有氧运动", completed: false, notes: "", images: [] },
            { id: 4, text: "全年完成 12 本好书阅读", completed: false, notes: "", images: [] },
            { id: 5, text: "拥有一份双休+有加班费+不PUA+工资不低+能安心下班+有年假的工作", completed: false, notes: "", images: [] },
            { id: 6, text: "存 20 万人民币", completed: false, notes: "", images: [] }
        ];

        let currentActiveIndex = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadPlans();
        });

        function getStoredPlans() {
            const data = localStorage.getItem('my_2027_plans_v2');
            if (!data) return defaultPlans;
            try { return JSON.parse(data); } catch (e) { return defaultPlans; }
        }

        function savePlans(plans) {
            localStorage.setItem('my_2027_plans_v2', JSON.stringify(plans));
        }

        // 渲染首页列表
        function loadPlans() {
            const plans = getStoredPlans();
            const list = document.getElementById('planList');
            list.innerHTML = '';

            plans.forEach((plan, index) => {
                const item = document.createElement('div');
                item.className = `plan-item`;

                item.innerHTML = `
                    <input type="checkbox" ${plan.completed ? 'checked' : ''} onchange="toggleComplete(${index}, event)">
                    <div class="plan-content" onclick="openDetail(${index})">
                        <div class="plan-title" contenteditable="true" onblur="updatePlanText(${index}, this, event)" onclick="event.stopPropagation()">${escapeHtml(plan.text)}</div>
                        <div class="detail-link-tip">👉 点击查看手记记录 (${plan.images ? plan.images.length : 0} 图)</div>
                    </div>
                    <button class="delete-btn" onclick="deletePlan(${index}, event)">×</button>
                `;
                list.appendChild(item);
            });
        }

        // 添加新目标
        function addPlan() {
            const input = document.getElementById('planInput');
            const text = input.value.trim();
            if (!text) return;

            const plans = getStoredPlans();
            plans.push({ id: Date.now(), text: text, completed: false, notes: "", images: [] });
            savePlans(plans);
            loadPlans();
            input.value = '';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') addPlan();
        }

        // 勾选状态（保留文字本身不加删除线）
        function toggleComplete(index, event) {
            event.stopPropagation();
            const plans = getStoredPlans();
            plans[index].completed = !plans[index].completed;
            savePlans(plans);
            loadPlans();
        }

        // 修改目标文字
        function updatePlanText(index, element, event) {
            event.stopPropagation();
            const newText = element.textContent.trim();
            const plans = getStoredPlans();
            if (!newText) {
                element.textContent = plans[index].text;
                return;
            }
            plans[index].text = newText;
            savePlans(plans);
        }

        // 删除目标
        function deletePlan(index, event) {
            event.stopPropagation();
            if (confirm('确定要删除这个目标吗？')) {
                const plans = getStoredPlans();
                plans.splice(index, 1);
                savePlans(plans);
                loadPlans();
            }
        }

        // ================= 详情页逻辑 =================
        function openDetail(index) {
            currentActiveIndex = index;
            const plans = getStoredPlans();
            const plan = plans[index];

            document.getElementById('currentDetailTitle').textContent = plan.text;
            document.getElementById('detailNotes').value = plan.notes || "";
            renderImages(plan.images || []);

            document.getElementById('homeView').style.display = 'none';
            document.getElementById('detailView').style.display = 'flex';
        }

        function goBackToHome() {
            currentActiveIndex = null;
            document.getElementById('detailView').style.display = 'none';
            document.getElementById('homeView').style.display = 'block';
            loadPlans();
        }

        function autoSaveDetail() {
            if (currentActiveIndex === null) return;
            const plans = getStoredPlans();
            const notes = document.getElementById('detailNotes').value;
            plans[currentActiveIndex].notes = notes;
            savePlans(plans);
        }

        function handleImageUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;

            const plans = getStoredPlans();
            if (!plans[currentActiveIndex].images) {
                plans[currentActiveIndex].images = [];
            }

            let loadedCount = 0;
            Array.from(files).forEach(file => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    plans[currentActiveIndex].images.push(e.target.result);
                    loadedCount++;
                    if (loadedCount === files.length) {
                        savePlans(plans);
                        renderImages(plans[currentActiveIndex].images);
                    }
                };
                reader.readAsDataURL(file);
            });
            event.target.value = '';
        }

        function renderImages(images) {
            const container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';

            images.forEach((imgSrc, imgIndex) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.innerHTML = `
                    <img src="${imgSrc}" alt="达成凭证">
                    <button class="remove-img-btn" onclick="removeImage(${imgIndex})">×</button>
                `;
                container.appendChild(card);
            });
        }

        function removeImage(imgIndex) {
            if (currentActiveIndex === null) return;
            const plans = getStoredPlans();
            plans[currentActiveIndex].images.splice(imgIndex, 1);
            savePlans(plans);
            renderImages(plans[currentActiveIndex].images);
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function (m) { return map[m]; });
        }
    </script>
</body>

</html>
