<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 新年计划</title>
    <!-- Tailwind CSS CDN for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-100 transition-all duration-300 hover:shadow-2xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <span class="inline-block bg-indigo-50 text-indigo-600 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider mb-2">2027 Goals</span>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">✨ 2027 新年计划</h1>
            <p class="text-sm text-slate-500 mt-1">健康生活，从点滴日常做起</p>
        </div>

        <!-- Plan Items -->
        <div class="space-y-4">
            <!-- Item 1 -->
            <label class="flex items-center p-3 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-indigo-50/30 transition cursor-pointer group">
                <input type="checkbox" class="w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 transition">
                <div class="ml-3">
                    <span class="block text-sm font-medium text-slate-700 group-hover:text-indigo-900 transition">每天规律睡眠 7 小时</span>
                    <span class="block text-xs text-slate-400">充足休息，蓄力每一天</span>
                </div>
            </label>

            <!-- Item 2 -->
            <label class="flex items-center p-3 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-indigo-50/30 transition cursor-pointer group">
                <input type="checkbox" class="w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 transition">
                <div class="ml-3">
                    <span class="block text-sm font-medium text-slate-700 group-hover:text-indigo-900 transition">周末出门晒一次太阳</span>
                    <span class="block text-xs text-slate-400">拥抱大自然，吸收维生素D</span>
                </div>
            </label>

            <!-- Item 3 -->
            <label class="flex items-center p-3 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-indigo-50/30 transition cursor-pointer group">
                <input type="checkbox" class="w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 transition">
                <div class="ml-3">
                    <span class="block text-sm font-medium text-slate-700 group-hover:text-indigo-900 transition">每周进行 3 次有氧运动</span>
                    <span class="block text-xs text-slate-400">跑步、游泳或健身，保持活力</span>
                </div>
            </label>

            <!-- Item 4 -->
            <label class="flex items-center p-3 rounded-xl border border-slate-100 bg-slate-50/50 hover:bg-indigo-50/30 transition cursor-pointer group">
                <input type="checkbox" class="w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500 transition">
                <div class="ml-3">
                    <span class="block text-sm font-medium text-slate-700 group-hover:text-indigo-900 transition">全年完成 12 本好书阅读</span>
                    <span class="block text-xs text-slate-400">每月一本，静心沉淀自我</span>
                </div>
            </label>
        </div>

        <!-- Footer Note -->
        <div class="mt-8 text-center text-xs text-slate-400">
            Keep going, you've got this! 🚀
        </div>
    </div>

</body>
</html>
